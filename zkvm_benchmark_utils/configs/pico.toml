# ================================================================
# Pico zkVM Benchmark Configuration
# ================================================================

name = "pico"
version = "v1.1.6"
enabled = true
default_mode = "fast"

# 测试规模（程序输入 N 值）
# 注意：如果配置了 programs，test_scales 将被忽略（向后兼容保留）
test_scales = [10, 20]

# 证明模式
# Pico 目前只支持 "fast" 模式
prove_modes = ["fast"]

# Pico 项目路径
working_dir = "../pico-zkvm/pico-host"

# 构建和运行命令
# 注意：Guest ELF 需要预先构建或使用预构建的 ELF
build_command = "cargo build --release"
run_command = "cargo run --release"

# 超时设置（秒）
timeout_seconds = 3600

# 重复次数
repeat_count = 1

# 程序配置
[[programs]]
name = "fibonacci"
scales = [10, 20]

# ----------------------------------------------------------------
# 环境变量
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "debug"
# Note: PICO_PROOF_MODE is injected by the runner

# ----------------------------------------------------------------
# 解析规则 (Parsed Metrics)
# ----------------------------------------------------------------
[parsed_metrics]
# ================================================================
# 基础信息 (Basic Info)
# ================================================================
raw_program_name = 'BENCHMARK: program_name=(\w+)'
raw_zkvm_name = 'BENCHMARK: zkvm_name=(\w+)'
raw_zkvm_version = 'BENCHMARK: zkvm_version=([\w.]+)'
raw_proof_mode = 'BENCHMARK: proof_mode=(\w+)'

# ================================================================
# 初始化阶段 (Initialization Phase)
# ================================================================
raw_elf_size_bytes = 'BENCHMARK: elf_size_bytes=(\d+)'
raw_initialization_time_s = 'BENCHMARK: initialization_time_s=([\d.]+)'

# ================================================================
# 执行阶段 (Execution Phase)
# ================================================================
raw_execution_setup_time_s = 'BENCHMARK: execution_setup_time_s=([\d.]+)'

# ================================================================
# 证明阶段 (Proving Phase)
# ================================================================
raw_proof_time_s = 'BENCHMARK: proof_time_s=([\d.]+)'
raw_proof_size_bytes = 'BENCHMARK: proof_size_bytes=(\d+)'

# ================================================================
# 输出结果 (Output)
# ================================================================
raw_output_result = 'BENCHMARK: output_result=(\d+)'
raw_success_status = 'BENCHMARK: success_status=(\w+)'

# ================================================================
# SDK 内部日志 (SDK Internal Logs)
# ================================================================
# Pico SDK 可能输出的内部日志指标
pico_execution_cycles = 'execution cycles: (\d+)'
pico_proving_time = 'proving time: ([\d.]+)s'

# ----------------------------------------------------------------
# 指标映射 (Metric Mapping)
# ----------------------------------------------------------------
[metric_mapping]
# ====================
# 1. Execution Phase
# ====================
"execution_time_s" = "raw_execution_setup_time_s"

# ====================
# 2. VM Circuit Phase (Pico uses "fast" mode which is single-stage)
# ====================
"vm_prove_time_s" = "raw_proof_time_s"
"vm_prove_proof_size_bytes" = "raw_proof_size_bytes"

# ====================
# 3. Verification Phase
# ====================
"success_status" = "raw_success_status"

# ====================
# 4. Initialization
# ====================
"prover_initialization_time_s" = "raw_initialization_time_s"

