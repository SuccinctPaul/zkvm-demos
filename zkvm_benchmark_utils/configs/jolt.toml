# ================================================================
# Jolt zkVM Benchmark Configuration
# ================================================================

name = "jolt"
version = "v1.0.0"
enabled = true
default_mode = "core"

# 测试规模（Fibonacci N 值）
test_scales = [10, 20]

# 证明模式
prove_modes = ["core"]

# Jolt 项目路径
working_dir = "../jolt-zkvm/jolt-host"

# 构建和运行命令
build_command = "cargo build --release"
run_command = "cargo run --release"

# 超时设置（秒）
timeout_seconds = 3600

# 重复次数
repeat_count = 1

# ----------------------------------------------------------------
# 环境变量
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "info"

# ----------------------------------------------------------------
# 解析规则 (Parsed Metrics)
# ----------------------------------------------------------------
[parsed_metrics]
# Preprocessing
raw_compile_time = 'Compile time:\s+([\d.]+)s'
raw_preprocess_time = 'Preprocess time:\s+([\d.]+)s'
raw_build_time = 'Build time:\s+([\d.]+)s'

# VM Circuit Phase (Core)
raw_prove_time = 'Prove time:\s+([\d.]+)s'
raw_verify_time = 'Verify time:\s+([\d.]+)s'
raw_total_time = 'Total time:\s+([\d.]+)s'

# ----------------------------------------------------------------
# 指标映射 (Metric Mapping)
# ----------------------------------------------------------------
[metric_mapping]
"vm_prove_time_s" = "raw_prove_time"
"verification_time_s" = "raw_verify_time"
"total_time_s" = "raw_total_time"
