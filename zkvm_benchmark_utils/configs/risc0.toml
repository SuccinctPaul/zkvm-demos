# ================================================================
# Risc0 zkVM Benchmark Configuration
# ================================================================

name = "risc0"
version = "v1.0.0"
enabled = true
default_mode = "groth16"

# 测试规模（Fibonacci N 值）
test_scales = [10, 20]

# 证明模式
prove_modes = ["core", "compressed", "groth16"]

# Risc0 项目路径
working_dir = "../risc0-zkvm/risc0-host"

# 构建和运行命令
build_command = "cargo build --release"
run_command = "cargo run --release"

# 超时设置（秒）
timeout_seconds = 3600

# 重复次数
repeat_count = 1

# ----------------------------------------------------------------
# 环境变量
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "debug"
RISC0_DEV_MODE = "0"
# Note: RISC0_PROOF_MODE is injected by the runner

# ----------------------------------------------------------------
# 解析规则 (Parsed Metrics)
# ----------------------------------------------------------------
[parsed_metrics]
# Execution Phase
# Guest prints: "fibonacci (cycle tracker): 1688"
raw_total_cycles = 'fibonacci \(cycle tracker\): (\d+)'
raw_user_cycles = 'fibonacci \(cycle tracker\): (\d+)'
# Host prints (new): "BENCHMARK: execution_time_s=..."
raw_execution_time_s = 'BENCHMARK: execution_time_s=([\d.]+)'
# Fallback for old logs
raw_execution_time_ms = 'execution time: ([\d.]+)ms'

# VM Circuit Phase (Core)
# Host prints (new): "BENCHMARK: proof_time_s=..."
raw_proof_time_s = 'BENCHMARK: proof_time_s=([\d.]+)'
# Fallback for old logs
raw_proof_time_old = 'proof time total cost\(s\): ([\d.]+)'

# Segments line: "prove_session: exit_code = Halted(0), journal = Some(""), segments: 1"
raw_segment_count = 'segments: (\d+)'
# STARK proof size from debug logs
raw_stark_proof_size = 'Proof size = (\d+)'

# SNARK Phase (Groth16)
raw_final_proof_size = 'proof size: (\d+) Bytes'
raw_snark_type = 'proof mode: (\w+)'

# ----------------------------------------------------------------
# 指标映射 (Metric Mapping)
# ----------------------------------------------------------------
[metric_mapping]
"total_cycles" = "raw_total_cycles"
"instruction_count" = "raw_user_cycles"
# metrics.rs handles unit conversion if _s is missing and _ms is present
"execution_time_s" = "raw_execution_time_s"
"execution_time_ms" = "raw_execution_time_ms"

"vm_chunk_count" = "raw_segment_count"
"vm_prove_time_s" = "raw_proof_time_s"
"vm_prove_proof_size_bytes" = "raw_stark_proof_size"

# Recursive / Aggressive
"aggressive_prove_time_s" = "raw_proof_time_s"
"aggressive_proof_size_bytes" = "raw_final_proof_size"

# SNARK
"snark_proof_time_s" = "raw_proof_time_s"
"snark_proof_size_bytes" = "raw_final_proof_size"
"snark_type" = "raw_snark_type"
