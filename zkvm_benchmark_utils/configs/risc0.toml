# ================================================================
# Risc0 zkVM Benchmark Configuration
# ================================================================

name = "risc0"
version = "v1.0.0"
enabled = true
default_mode = "groth16"

# 测试规模（Fibonacci N 值）
test_scales = [10, 20]

# 证明模式
prove_modes = ["core", "compressed", "groth16"]

# Risc0 项目路径
working_dir = "../risc0-zkvm/risc0-host"

# 构建和运行命令
build_command = "cargo build --release"
run_command = "cargo run --release"

# 超时设置（秒）
timeout_seconds = 3600

# 重复次数
repeat_count = 1

# ----------------------------------------------------------------
# 环境变量
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "debug"
RISC0_DEV_MODE = "0"

# ----------------------------------------------------------------
# 解析规则 (Parsed Metrics)
# ----------------------------------------------------------------
[parsed_metrics]
# Execution Phase
raw_total_cycles = 'INFO.*session:\s+(\d+) total cycles'
raw_user_cycles = 'INFO.*session:\s+(\d+) user cycles'
raw_execution_time_ms = 'execution time: ([\d.]+)ms'

# VM Circuit Phase (Core)
# Use 'raw_proof_time' for all phases as Risc0 reports total time
raw_proof_time = 'proof time.*cost\(s\):\s+([\d.]+)'
raw_segment_count = 'number of segments:\s+(\d+)'
# STARK proof size from debug logs (might be missing in INFO mode)
raw_stark_proof_size = 'DEBUG.*Proof size\s*=\s*(\d+)'

# SNARK Phase (Groth16)
# From: "proof mode: {:?}, proof size: {:?} Bytes, proof time total cost(s): {:?}"
raw_final_proof_size = 'proof size: (\d+) Bytes'
raw_snark_type = 'proof mode: (\w+)'

# ----------------------------------------------------------------
# 指标映射 (Metric Mapping)
# ----------------------------------------------------------------
[metric_mapping]
"total_cycles" = "raw_total_cycles"
"instruction_count" = "raw_user_cycles"
"vm_chunk_count" = "raw_segment_count"
"vm_prove_time_s" = "raw_proof_time"
"vm_prove_proof_size_bytes" = "raw_stark_proof_size"
"aggressive_prove_time_s" = "raw_proof_time"
"aggressive_proof_size_bytes" = "raw_final_proof_size"
"snark_proof_time_s" = "raw_proof_time"
"snark_proof_size_bytes" = "raw_final_proof_size"
"snark_type" = "raw_snark_type"
