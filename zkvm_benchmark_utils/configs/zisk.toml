# ================================================================
# ZisK zkVM Benchmark Configuration
# ================================================================
# ZisK is a zkVM by Polygon with focus on performance
# ⚠️ Note: Proof generation only supported on Linux x86_64
# macOS users should use Docker

name = "zisk"
version = "v0.10.0"
enabled = true
default_mode = "core"

# Test scales (program input N values)
test_scales = [10, 20]

# Proof modes
# ZisK uses VADCOP (Verifiable Arbitrary Distributed Computation Protocol)
prove_modes = ["core"]

# Working directory (zisk-guest subdirectory)
working_dir = "../zisk-zkvm/zisk-guest"

# Build command
# cargo-zisk build compiles for RISC-V zkVM target
build_command = "cargo-zisk build --release"

# Run command
# Uses wrapper script that:
# 1. Generates input.bin with correct PROGRAM_N
# 2. Runs cargo-zisk with the generated input
# Only support the Linux system.
run_command = "./run_benchmark.sh"

# Timeout settings (seconds)
# Proof generation can take 30-90 seconds
timeout_seconds = 600

# Repeat count
repeat_count = 1

# Program configuration
[[programs]]
name = "fibonacci"
scales = [10, 20]

# ----------------------------------------------------------------
# Environment Variables
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "info"
# FIBONACCI_N is set by the runner based on program scale

# ----------------------------------------------------------------
# Parsed Metrics (Regular Expressions)
# ----------------------------------------------------------------
[parsed_metrics]
# ================================================================
# Execution Output
# ZisK outputs computation results via ziskemu
# ================================================================
# Result from guest program: "Result: 89"
raw_output_result = 'Result:\s*(\d+)'
# Output value from ziskemu
raw_output_value = 'Output\s*\[\d+\]\s*=\s*(\d+)'

# ================================================================
# Build and Execution Time
# cargo-zisk run outputs timing info
# ================================================================
raw_build_time_s = 'Built in ([\d.]+)s'
raw_execution_time_s = 'Executed in ([\d.]+)s'

# ================================================================
# ROM Setup (First Time)
# "cargo-zisk rom-setup" outputs
# ================================================================
raw_rom_setup_time_s = 'ROM setup completed in ([\d.]+)s'

# ================================================================
# Proof Generation
# "cargo-zisk prove" outputs
# ================================================================
# Proof generation time: "Proof generated in 30.5s"
raw_proof_time_s = 'Proof generated in ([\d.]+)s'
# Alternative format from ZisK logs
raw_prove_duration_s = 'prove.*?(\d+\.?\d*)s'
# ProofMan logs
raw_proofman_time_s = 'ProofMan:.*completed in ([\d.]+)s'

# ================================================================
# Proof Verification
# "cargo-zisk verify" outputs
# ================================================================
# Verification success: "[INFO ] ProofMan:     ✓ Vadcop Final proof was verified"
raw_verify_success = 'Vadcop Final proof was (verified)'
raw_verification_time_s = 'Verification completed in ([\d.]+)s'
raw_verify_result = 'proof was (\w+)'

# ================================================================
# Cycles and Performance Metrics
# From ziskemu or cargo-zisk run output
# ================================================================
raw_total_cycles = 'Total cycles:\s*(\d+)'
raw_instruction_count = 'Instructions:\s*(\d+)'
raw_memory_operations = 'Memory operations:\s*(\d+)'

# ================================================================
# Proof Size
# ================================================================
raw_proof_size_bytes = 'Proof size:\s*(\d+)\s*bytes'
raw_vadcop_proof_size = 'vadcop_final_proof.*?(\d+)\s*bytes'

# ================================================================
# BENCHMARK Format (if implemented in wrapper)
# ================================================================
benchmark_program_name = 'BENCHMARK: program_name=(\w+)'
benchmark_zkvm_name = 'BENCHMARK: zkvm_name=(\w+)'
benchmark_zkvm_version = 'BENCHMARK: zkvm_version=([\w\.\-]+)'
benchmark_proof_time_s = 'BENCHMARK: proof_time_s=([\d.]+)'
benchmark_success_status = 'BENCHMARK: success_status=(\w+)'

# ----------------------------------------------------------------
# Metric Mapping (Raw -> Standard Keys)
# ----------------------------------------------------------------
[metric_mapping]
# ====================
# 1. Execution Phase
# ====================
"total_cycles" = "raw_total_cycles"
"instruction_count" = "raw_instruction_count"
"execution_time_s" = "raw_execution_time_s"

# ====================
# 2. Proving Phase
# ====================
"vm_prove_time_s" = "raw_proof_time_s"
"vm_prove_proof_size_bytes" = "raw_proof_size_bytes"

# ====================
# 3. Verification Phase
# ====================
"verification_time_s" = "raw_verification_time_s"

# ====================
# 4. Status
# ====================
"success_status" = "raw_verify_success"

# ====================
# 5. Initialization (ROM Setup)
# ====================
"prover_initialization_time_s" = "raw_rom_setup_time_s"

