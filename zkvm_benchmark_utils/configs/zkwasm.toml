# ================================================================
# zkWasm Benchmark Configuration
# ================================================================
# zkWasm is a WebAssembly-based zkVM using Halo2 proofs

name = "zk_wasm"
version = "v0.1.0"
enabled = true
default_mode = "core"
test_scales = [10, 20]
prove_modes = ["core"]

working_dir = "../zkwasm-zkvm"
build_command = "cargo build --release -p zkwasm-host"
run_command = "./target/release/zkwasm-host run"

timeout_seconds = 3600
repeat_count = 1

[[programs]]
name = "fibonacci"
scales = [10, 20]

[env_vars]
RUST_LOG = "debug"

[parsed_metrics]
# BENCHMARK format logs
raw_program_name = 'BENCHMARK: program_name=(\w+)'
raw_zkvm_name = 'BENCHMARK: zkvm_name=(\w+)'
raw_zkvm_version = 'BENCHMARK: zkvm_version=([\w\.\-]+)'
raw_proof_mode = 'BENCHMARK: proof_mode=(\w+)'
raw_success_status = 'BENCHMARK: success_status=(\w+)'
raw_total_time_s = 'BENCHMARK: total_time_s=([\d.]+)'

# Legacy format fallback
legacy_wasm_built = 'WASM built successfully'
legacy_circuit_setup = 'Circuit setup complete'
legacy_proof_generated = 'Proof generated successfully'
legacy_proof_verified = 'Proof verified successfully'

[metric_mapping]
"success_status" = "raw_success_status"
"total_time_s" = "raw_total_time_s"

