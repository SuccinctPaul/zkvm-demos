# ================================================================
# Cairo zkVM Benchmark Configuration
# ================================================================
# Default Prover: Stwo-Cairo (cairo-prove)
# 
# Stwo-Cairo is StarkWare's next-generation STARK prover featuring:
# - 60% faster proving time compared to Stone prover
# - 25% smaller proof size
# - 50% faster verification time
#
# Installation:
#   cd cairo-zkvm && ./install_stwo.sh
#
# If cairo-prove is not installed, falls back to execution-only mode.

name = "cairo"
version = "v2.8.5"
enabled = false
test_scales = [10, 20]
prove_modes = ["core"]

working_dir = "../zkvms/cairo-zkvm"
run_command = "./run_benchmark.sh"

timeout_seconds = 600
repeat_count = 1

[[programs]]
name = "fibonacci"
scales = [50, 100]

[[programs]]
name = "hash"
scales = [500]

[[programs]]
name = "sig"
scales = [1, 10, 50]

[env_vars]
RUST_LOG = "debug"
PROGRAM_ID = "0"
# PROGRAM_N is set dynamically by the benchmark runner

[parsed_metrics]
# ================================================================
# BENCHMARK Format Logs (Primary Source)
# ================================================================
raw_program_name = 'BENCHMARK: program_name=(\w+)'
raw_zkvm_name = 'BENCHMARK: zkvm_name=(\w+)'
raw_zkvm_version = 'BENCHMARK: zkvm_version=([\w\.\-]+)'
raw_proof_mode = 'BENCHMARK: proof_mode=(\w+)'
raw_prover_backend = 'BENCHMARK: prover_backend=([\w\-]+)'
raw_prover_version = 'BENCHMARK: prover_version=([\w\.\-\s]+)'

# ================================================================
# Compilation Phase
# ================================================================
raw_compile_time_s = 'BENCHMARK: compile_time_s=([\d.]+)'
raw_executable_size = 'BENCHMARK: executable_size_bytes=(\d+)'

# ================================================================
# Execution Phase
# ================================================================
raw_execution_time_s = 'BENCHMARK: execution_time_s=([\d.]+)'
raw_output_result = 'BENCHMARK: output_result=(\d+)'
raw_gas_used = 'BENCHMARK: gas_used=(\d+)'
raw_total_cycles = 'BENCHMARK: total_cycles=(\d+)'

# ================================================================
# Proving Phase (Stwo-Cairo)
# ================================================================
raw_proof_time_s = 'BENCHMARK: proof_time_s=([\d.]+)'
raw_proof_size_bytes = 'BENCHMARK: proof_size_bytes=(\d+)'

# ================================================================
# Verification Phase
# ================================================================
raw_verification_time_s = 'BENCHMARK: verification_time_s=([\d.]+)'
raw_success_status = 'BENCHMARK: success_status=(\w+)'

# ================================================================
# Total Time
# ================================================================
raw_total_time_s = 'BENCHMARK: total_time_s=([\d.]+)'

[metric_mapping]
# ====================
# 1. Compilation Phase
# ====================
"compilation_time_s" = "raw_compile_time_s"

# ====================
# 2. Execution Phase
# ====================
"execution_time_s" = "raw_execution_time_s"
"total_cycles" = "raw_total_cycles"

# ====================
# 3. Proving Phase
# ====================
"vm_prove_time_s" = "raw_proof_time_s"
"vm_prove_proof_size_bytes" = "raw_proof_size_bytes"

# ====================
# 4. Verification Phase
# ====================
"verification_time_s" = "raw_verification_time_s"

# ====================
# 5. Status & Summary
# ====================
"success_status" = "raw_success_status"
"total_time_s" = "raw_total_time_s"
