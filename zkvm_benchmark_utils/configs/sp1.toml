# ================================================================
# SP1 zkVM Benchmark Configuration
# ================================================================

name = "sp1"
version = "v5.0.0"
enabled = true
default_mode = "groth16"

# 测试规模（Fibonacci N 值）
# 注意：如果配置了 programs，test_scales 将被忽略（向后兼容保留）
test_scales = [10, 20]

# 证明模式
prove_modes = ["core", "compressed", "groth16"]

# SP1 项目路径
working_dir = "../sp1-zkvm/sp1-host"

# 构建和运行命令
build_command = "cargo build --release"
run_command = "cargo run --release -- --prove"

# 超时设置（秒）
timeout_seconds = 3600

# 重复次数
repeat_count = 1

# 程序配置（推荐使用此方式配置多个程序）
# 注意：必须放在所有其他必需字段之后，否则 TOML 解析器会提前结束
[[programs]]
name = "fibonacci"
scales = [10, 20]

# 可以为不同程序配置不同的参数
# [[programs]]
# name = "hash"
# scales = [100, 1000]
# timeout_seconds = 7200  # 可选：程序特定超时

# [[programs]]
# name = "sum"
# scales = [100, 1000, 10000]

# ----------------------------------------------------------------
# 环境变量
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "debug"

# ----------------------------------------------------------------
# 解析规则 (Parsed Metrics)
# ----------------------------------------------------------------
[parsed_metrics]
# Raw 提取 (Extract)
# 这里我们使用 raw_ 前缀来区分原始数据和标准数据
raw_total_cycles = '(?:BENCHMARK: |execution report \(totals\): )total_cycles=(\d+)'
raw_total_instruction_count = '(?:BENCHMARK: |execution report \(totals\): )total_instruction_count=(\d+)'
raw_total_prove_time_s = 'BENCHMARK: total_prove_time_s=([\d.]+)'
raw_final_proof_size_bytes = 'BENCHMARK: .*_proof_size_bytes=(\d+)'
raw_verification_time_s = '(?:BENCHMARK: verification_time_s=|Verification Phase.*\n.*verification_time_s=)([\d.]+)'
raw_on_chain_gas_estimate = 'BENCHMARK: on_chain_gas_estimate=(\d+)'
raw_success_status = '(?:BENCHMARK: success_status=|success_status=)(\w+)'
raw_execution_time_s = 'BENCHMARK: execute_time_s=([\d.]+)'
raw_snark_type = 'prover done.*backend=(\w+)'

# 其他指标保持原样提取，稍后在 metric_mapping 中决定是否标准化
gas = 'gas: (\d+)'
total_syscall_cycles = 'total_syscall_cycles=(\d+)'
touched_memory_addresses = 'touched_memory_addresses=(\d+)'
vm_core_proof_size_bytes = 'BENCHMARK: vm_core_proof_size_bytes=(\d+)'
vm_circuit_chunk_count = 'BENCHMARK: vm_circuit_chunk_count=(\d+)'
compressed_proof_size_bytes = 'BENCHMARK: compressed_proof_size_bytes=(\d+)'
groth16_proof_size_bytes = 'BENCHMARK: groth16_proof_size_bytes=(\d+)'

# ================================================================
# P1 证明阶段指标 (Proving Phase Metrics)
# ================================================================

# Core Proof 阶段
# 兼容多种日志格式
core_proof_total_time_s = 'prove_core:phase 2 prover: close time\.busy=([\d.]+)s'
phase2_trace_generation_time_ms = 'phase 2 trace generation:.*close time\.busy=([\d.]+)ms'
main_traces_generation_time_ms = 'generate main traces:.*close time\.busy=([\d.]+)ms'
recursion_program_build_time_ms = 'build recursion program:.*close time\.busy=([\d.]+)ms'
recursion_program_compile_time_ms = 'compile recursion program:.*close time\.busy=([\d.]+)ms'
core_merkle_tree_build_time_ms = 'phase 2 prover:batch:commit:build merkle tree:.*close time\.busy=([\d.]+)ms'
core_permutation_generation_time_ms = 'phase 2 prover:batch:opening:generate permutation traces:.*close time\.busy=([\d.]+)ms'
core_quotient_compute_time_ms = 'phase 2 prover:batch:opening:compute quotient values:.*close time\.busy=([\d.]+)ms'
core_multi_batch_opening_time_s = 'phase 2 prover:batch:opening:open multi batches:.*close time\.busy=([\d.]+)s'

# Compress 阶段
compress_total_time_s = 'compress: close time\.busy=([\d.]+)s'
compress_generate_records_time_ms = 'compress:generate records and traces:.*close time\.busy=([\d.]+)ms'
compress_setup_time_ms = 'compress:prove:batch:Setup compress program:setup machine:.*close time\.busy=([\d.]+)ms'
compress_commit_time_ms = 'compress:prove:batch:commit:.*close time\.busy=([\d.]+)ms'
compress_permutation_time_ms = 'compress:prove:batch:open:generate permutation traces:.*close time\.busy=([\d.]+)ms'
compress_quotient_compute_time_ms = 'compress:prove:batch:open:compute quotient values:.*close time\.busy=([\d.]+)ms'
compress_opening_time_s = 'compress:prove:batch:open:.*close time\.busy=([\d.]+)s time\.idle=[\d.]+ns$'
compress_merkle_tree_build_time_ms = 'compress:prove:batch:commit:build merkle tree:.*close time\.busy=([\d.]+)ms'

# Shrink 阶段
shrink_total_time_s = 'shrink:prove_shards: close time\.busy=([\d.]+)s'
shrink_program_build_time_ms = 'shrink:build shrink program:.*close time\.busy=([\d.]+)ms'
shrink_program_compile_time_ms = 'shrink:compile shrink program:.*close time\.busy=([\d.]+)ms'
shrink_setup_time_ms = 'shrink:setup shrink:setup machine:.*close time\.busy=([\d.]+)ms'
shrink_prove_time_s = 'shrink:prove_shards:.*close time\.busy=([\d.]+)s'
shrink_merkle_tree_build_time_ms = 'shrink:prove_shards:build merkle tree:.*close time\.busy=([\d.]+)ms'
shrink_permutation_time_ms = 'shrink:prove_shards:generate permutation traces:.*close time\.busy=([\d.]+)ms'
shrink_quotient_compute_time_ms = 'shrink:prove_shards:compute quotient values:.*close time\.busy=([\d.]+)ms'

# Shrink 事件计数
shrink_total_events = 'shrink: total events: (\d+)'
shrink_base_alu_events = 'shrink:   base_alu_events: (\d+)'
shrink_batch_fri_events = 'shrink:   batch_fri_events: (\d+)'
shrink_ext_alu_events = 'shrink:   ext_alu_events: (\d+)'
shrink_mem_const_count = 'shrink:   mem_const_count: (\d+)'
shrink_mem_var_events = 'shrink:   mem_var_events: (\d+)'
shrink_poseidon2_events = 'shrink:   poseidon2_events: (\d+)'
shrink_select_events = 'shrink:   select_events: (\d+)'
shrink_exp_reverse_bits_len_events = 'shrink:   exp_reverse_bits_len_events: (\d+)'

# Wrap BN254 阶段
# 匹配示例:
wrap_total_time_s = 'wrap_bn254: wrap proving time: ([\d.]+)s'
wrap_program_build_time_ms = 'wrap_bn254:build compress program:.*close time\.busy=([\d.]+)ms'
wrap_program_compile_time_ms = 'wrap_bn254:compile compress program:.*close time\.busy=([\d.]+)ms'
wrap_setup_time_s = 'wrap_bn254:setup wrap:setup machine:.*close time\.busy=([\d.]+)s'
wrap_prove_time_s = 'wrap_bn254:prove_shards:.*close time\.busy=([\d.]+)s'
wrap_verify_time_ms = 'wrap_bn254:verify:.*close time\.busy=([\d.]+)ms'
wrap_merkle_tree_build_time_s = 'wrap_bn254:prove_shards:build merkle tree:.*close time\.busy=([\d.]+)s'
wrap_permutation_time_ms = 'wrap_bn254:prove_shards:generate permutation traces:.*close time\.busy=([\d.]+)ms'

# Wrap BN254 事件计数
wrap_total_events = 'wrap_bn254: total events: (\d+)'
wrap_base_alu_events = 'wrap_bn254:   base_alu_events: (\d+)'
wrap_ext_alu_events = 'wrap_bn254:   ext_alu_events: (\d+)'
wrap_mem_const_count = 'wrap_bn254:   mem_const_count: (\d+)'
wrap_mem_var_events = 'wrap_bn254:   mem_var_events: (\d+)'
wrap_poseidon2_events = 'wrap_bn254:   poseidon2_events: (\d+)'
wrap_select_events = 'wrap_bn254:   select_events: (\d+)'

# ================================================================
# P1 Groth16 阶段指标 (Groth16 Phase Metrics)
# ================================================================
# removed duplicate groth16_proof_size_bytes here
groth16_r1cs_reading_time_s = 'Reading R1CS took ([\d.]+)s'
groth16_proving_key_reading_time_s = 'Reading proving key took ([\d.]+)s'
groth16_witness_reading_time_ms = 'Reading witness file took ([\d.]+)ms'
groth16_witness_generation_time_ms = 'Generating witness took ([\d.]+)ms'
groth16_constraint_count = 'nbConstraints=(\d+)'
groth16_solver_time_s = 'constraint system solver done.*took=([\d.]+)'
groth16_prover_time_s = 'prover done.*took=([\d.]+)'
groth16_generation_time_s = 'Generating proof took ([\d.]+)s'
groth16_verifier_time_ms = 'verifier done.*took=([\d.]+)'
groth16_total_time_s = 'wrap_groth16_bn254:.*close time\.busy=([\d.]+)s'

# ================================================================
# P2 验证指标 (Verification Metrics)
# ================================================================
on_chain_gas_estimate = 'BENCHMARK: on_chain_gas_estimate=(\d+)'

# ================================================================
# P2 性能效率指标 (Performance Metrics)
# ================================================================
# vm circuit(core proof) khz
vm_prove_khz = 'khz=([\d.]+)'

# ================================================================
# P2 初始化指标 (Initialization Metrics)
# ================================================================
prover_initialization_time_s = 'initialize prover:.*close time\.busy=([\d.]+)s'
compress_program_build_total_time_ms = 'initialize prover:build compress program:.*close time\.busy=([\d.]+)ms'
compress_program_compile_total_time_ms = 'initialize prover:compile compress program:.*close time\.busy=([\d.]+)ms'

# ================================================================
# P3 指令统计 (Instruction Statistics)
# ================================================================
# RISC-V 基础指令
opcode_add = 'execution report.*\n.*(\d+) add'
opcode_sub = 'execution report.*\n.*(\d+) sub'
opcode_mul = 'execution report.*\n.*(\d+) mul'
opcode_and = 'execution report.*\n.*(\d+) and'
opcode_or = 'execution report.*\n.*(\d+) or'
opcode_xor = 'execution report.*\n.*(\d+) xor'
opcode_sll = 'execution report.*\n.*(\d+) sll'
opcode_srl = 'execution report.*\n.*(\d+) srl'
opcode_sra = 'execution report.*\n.*(\d+) sra'

# 内存访问指令
opcode_lw = 'execution report.*\n.*(\d+) lw'
opcode_sw = 'execution report.*\n.*(\d+) sw'
opcode_lb = 'execution report.*\n.*(\d+) lb'
opcode_lbu = 'execution report.*\n.*(\d+) lbu'
opcode_sb = 'execution report.*\n.*(\d+) sb'
opcode_lh = 'execution report.*\n.*(\d+) lh'
opcode_lhu = 'execution report.*\n.*(\d+) lhu'
opcode_sh = 'execution report.*\n.*(\d+) sh'

# 分支和跳转指令
opcode_beq = 'execution report.*\n.*(\d+) beq'
opcode_bne = 'execution report.*\n.*(\d+) bne'
opcode_blt = 'execution report.*\n.*(\d+) blt'
opcode_bge = 'execution report.*\n.*(\d+) bge'
opcode_bltu = 'execution report.*\n.*(\d+) bltu'
opcode_bgeu = 'execution report.*\n.*(\d+) bgeu'
opcode_jal = 'execution report.*\n.*(\d+) jal'
opcode_jalr = 'execution report.*\n.*(\d+) jalr'

# 其他指令
opcode_lui = 'execution report.*\n.*(\d+) lui'
opcode_auipc = 'execution report.*\n.*(\d+) auipc'
opcode_ecall = 'execution report.*\n.*(\d+) ecall'
opcode_sltu = 'execution report.*\n.*(\d+) sltu'

# ================================================================
# P3 系统调用统计 (Syscall Statistics)
# ================================================================
syscall_commit = 'syscall counts.*\n.*(\d+) commit$'
syscall_commit_deferred_proofs = 'syscall counts.*\n.*(\d+) commit_deferred_proofs'
syscall_halt = 'syscall counts.*\n.*(\d+) halt'
syscall_write = 'syscall counts.*\n.*(\d+) write$'
syscall_hint_len = 'syscall counts.*\n.*(\d+) hint_len'
syscall_hint_read = 'syscall counts.*\n.*(\d+) hint_read'
syscall_sha_compress = 'syscall counts.*\n.*(\d+) sha_compress'
syscall_ed_add = 'syscall counts.*\n.*(\d+) ed_add'
syscall_ed_decompress = 'syscall counts.*\n.*(\d+) ed_decompress'
syscall_keccak_permute = 'syscall counts.*\n.*(\d+) keccak_permute'
syscall_secp256k1_add = 'syscall counts.*\n.*(\d+) secp256k1_add'
syscall_secp256k1_double = 'syscall counts.*\n.*(\d+) secp256k1_double'
syscall_secp256k1_decompress = 'syscall counts.*\n.*(\d+) secp256k1_decompress'
syscall_bn254_add = 'syscall counts.*\n.*(\d+) bn254_add'
