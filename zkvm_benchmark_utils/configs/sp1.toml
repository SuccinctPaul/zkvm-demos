syscall_uint256_mul = 'syscall counts.*\n.*(\d+) uint256_mul'

# ================================================================
# P3 芯片资源统计 (Chip Resource Statistics)
# ================================================================
# 格式: "Chip Name | Main Cols = X | Pre Cols = Y | Perm Cols = Z | Rows = R | Cells = C"

# Core 阶段芯片统计
chip_cpu_rows = 'phase 2 prover.*Cpu.*Rows = (\d+)'
chip_cpu_cells = 'phase 2 prover.*Cpu.*Cells = (\d+)'
chip_program_rows = 'phase 2 prover.*Program.*Rows = (\d+)'
chip_program_cells = 'phase 2 prover.*Program.*Cells = (\d+)'
chip_global_rows = 'phase 2 prover.*Global.*Rows = (\d+)'
chip_global_cells = 'phase 2 prover.*Global.*Cells = (\d+)'
chip_byte_rows = 'phase 2 prover.*Byte.*Rows = (\d+)'
chip_byte_cells = 'phase 2 prover.*Byte.*Cells = (\d+)'
chip_memory_global_init_rows = 'phase 2 prover.*MemoryGlobalInit.*Rows = (\d+)'
chip_memory_global_init_cells = 'phase 2 prover.*MemoryGlobalInit.*Cells = (\d+)'
chip_memory_global_finalize_rows = 'phase 2 prover.*MemoryGlobalFinalize.*Rows = (\d+)'
chip_memory_global_finalize_cells = 'phase 2 prover.*MemoryGlobalFinalize.*Cells = (\d+)'

# Compress 阶段芯片统计
chip_compress_batch_fri_rows = 'compress:prove:batch:open.*BatchFRI.*Rows = (\d+)'
chip_compress_batch_fri_cells = 'compress:prove:batch:open.*BatchFRI.*Cells = (\d+)'
chip_compress_memory_var_rows = 'compress:prove:batch:open.*MemoryVar.*Rows = (\d+)'
chip_compress_memory_var_cells = 'compress:prove:batch:open.*MemoryVar.*Cells = (\d+)'
chip_compress_poseidon2_rows = 'compress:prove:batch:open.*Poseidon2WideDeg3.*Rows = (\d+)'
chip_compress_poseidon2_cells = 'compress:prove:batch:open.*Poseidon2WideDeg3.*Cells = (\d+)'
chip_compress_base_alu_rows = 'compress:prove:batch:open.*BaseAlu.*Rows = (\d+)'
chip_compress_base_alu_cells = 'compress:prove:batch:open.*BaseAlu.*Cells = (\d+)'
chip_compress_ext_alu_rows = 'compress:prove:batch:open.*ExtAlu.*Rows = (\d+)'
chip_compress_ext_alu_cells = 'compress:prove:batch:open.*ExtAlu.*Cells = (\d+)'

# ================================================================
# P3 Merkle Tree 维度信息 (Merkle Tree Dimensions)
# ================================================================
# 提取 Merkle Tree 的维度信息，例如 "dimensions="[14x1048576, 11x131072]""
core_merkle_dimensions = 'phase 2 prover:batch:commit:build merkle tree:.*dimensions="([^"]+)"'
compress_merkle_dimensions = 'compress:prove:batch:commit:build merkle tree:.*dimensions="([^"]+)"'
shrink_merkle_dimensions = 'shrink:prove_shards:build merkle tree:.*dimensions="([^"]+)"'
wrap_merkle_dimensions = 'wrap_bn254:prove_shards:build merkle tree:.*dimensions="([^"]+)"'

# ================================================================
# P3 内存优化提示 (Memory Optimization Hints)
# ================================================================
# 记录可以优化的行数
rows_reduction_hint_count = '(fixed log2 rows can be potentially reduced.*)'

# ----------------------------------------------------------------
# 指标映射 (Metric Mapping)
# ----------------------------------------------------------------
[metric_mapping]
# 映射规则: Standard Key = Raw Key (Transform)
# 这些标准 Key 将会被框架识别并用于衍生计算 (Derivation) 和 统一报告 (Unified Reporting)

# ====================
# 1. Execution Phase
# ====================
"total_cycles" = "raw_total_cycles"
"instruction_count" = "raw_total_instruction_count"
"execution_time_s" = "raw_execution_time_s"

# ====================
# 2. VM Circuit Phase
# ====================
"vm_prove_time_s" = "core_proof_total_time_s"
"vm_chunk_count" = "vm_circuit_chunk_count"
"vm_prove_proof_size_bytes" = "vm_core_proof_size_bytes"
"vm_prove_khz" = "vm_prove_khz"

# ====================
# 3. Aggresive Phase
# ====================
"aggressive_prove_time_s" = "compress_total_time_s"
"aggressive_proof_size_bytes" = "compressed_proof_size_bytes"

# ====================
# 4. SNARK Phase (Groth16)
# ====================
"snark_proof_time_s" = "groth16_generation_time_s"
"snark_proof_size_bytes" = "groth16_proof_size_bytes"
"snark_setup_time_s" = "groth16_r1cs_reading_time_s" # 近似映射
"snark_constraint_count" = "groth16_constraint_count"
"snark_type" = "raw_snark_type"

# ====================
# 5. Verification Phase
# ====================
"verification_time_s" = "raw_verification_time_s"
"on_chain_gas_estimate" = "raw_on_chain_gas_estimate"
"success_status" = "raw_success_status"

