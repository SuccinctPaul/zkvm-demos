# ================================================================
# snarkVM Benchmark Configuration
# ================================================================
# snarkVM is the Aleo network's zkVM using Marlin proving system

name = "snark_vm"
version = "v0.16.0"
enabled = true
default_mode = "core"
test_scales = [10, 20]
prove_modes = ["core"]

working_dir = "../snarkvm-zkvm/snarkvm-host"
build_command = "cargo build --release"
run_command = "cargo run --release"

timeout_seconds = 600
repeat_count = 1

[[programs]]
name = "fibonacci"
scales = [10, 20]

[env_vars]
RUST_LOG = "info"

[parsed_metrics]
# BENCHMARK format logs
raw_program_name = 'BENCHMARK: program_name=(\w+)'
raw_zkvm_name = 'BENCHMARK: zkvm_name=(\w+)'
raw_zkvm_version = 'BENCHMARK: zkvm_version=([\w\.\-]+)'
raw_proof_mode = 'BENCHMARK: proof_mode=(\w+)'
raw_execution_time_s = 'BENCHMARK: execution_time_s=([\d.]+)'
raw_output_result = 'BENCHMARK: output_result=(\d+)'
raw_success_status = 'BENCHMARK: success_status=(\w+)'
raw_total_time_s = 'BENCHMARK: total_time_s=([\d.]+)'

# Legacy format fallback
legacy_result = 'Result: (\d+)'
legacy_exec_time = 'Execution completed in ([\d.]+)s'

[metric_mapping]
"execution_time_s" = "raw_execution_time_s"
"success_status" = "raw_success_status"
"total_time_s" = "raw_total_time_s"

