# ================================================================
# Template zkVM Benchmark Configuration
# ================================================================

# zkVM 唯一标识符 (Lowercase)
name = "template"
version = "v1.0.0"
enabled = false
default_mode = "core"

# 测试规模（Fibonacci N 值）
# 注意：如果配置了 programs，test_scales 将被忽略（向后兼容保留）
test_scales = [10, 20]

# 程序配置（推荐使用此方式配置多个程序）
# 如果未配置 programs，将使用 test_scales 作为 Fibonacci 的参数
[[programs]]
name = "fibonacci"
scales = [10, 20]

# 可以为不同程序配置不同的参数和超时
# [[programs]]
# name = "hash"
# scales = [100, 1000]
# timeout_seconds = 7200  # 可选：程序特定超时

# [[programs]]
# name = "sum"
# scales = [100, 1000, 10000]

# 证明模式 (core, compressed, groth16, plonk)
prove_modes = ["core"]


# ----------------------------------------------------------------
# 环境变量
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "info"

# ----------------------------------------------------------------
# 解析规则 (Parsed Metrics)
# ----------------------------------------------------------------
# Define regexes to extract metrics from stdout/stderr.
# Capturing groups () are required for the value.
[parsed_metrics]
# Execution Phase
# raw_total_cycles = 'cycles:\s+(\d+)'
# raw_instruction_count = 'instructions:\s+(\d+)'

# VM Circuit Phase
# raw_proof_time = 'prove_time:\s+([\d.]+)s'
# raw_proof_size = 'proof_size:\s+(\d+)'

# ----------------------------------------------------------------
# 指标映射 (Metric Mapping)
# ----------------------------------------------------------------
# Map raw extracted keys to standard keys defined in std_keys.
# This ensures uniformity in reports.
[metric_mapping]
# "total_cycles" = "raw_total_cycles"
# "vm_prove_time_s" = "raw_proof_time"
# "vm_prove_proof_size_bytes" = "raw_proof_size"
