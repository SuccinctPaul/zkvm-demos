# ================================================================
# Nexus zkVM Benchmark Configuration
# ================================================================

name = "nexus"
version = "v1.0.0"
enabled = true
default_mode = "core"

# 测试规模（Fibonacci N 值）
test_scales = [10, 20]

# 证明模式
prove_modes = ["core"]

# Nexus 项目路径
working_dir = "../nexus-zkvm/nexus-host"

# 构建和运行命令
build_command = "cargo build --release"
run_command = "cargo run --release"

# 超时设置（秒）
timeout_seconds = 3600

# 重复次数
repeat_count = 1

# ----------------------------------------------------------------
# 环境变量
# ----------------------------------------------------------------
[env_vars]
RUST_LOG = "info"

# ----------------------------------------------------------------
# 解析规则 (Parsed Metrics)
# ----------------------------------------------------------------
[parsed_metrics]
# Execution Phase
raw_compile_time = 'Compile Cost: ([\d.]+)s'
raw_instruction_count = 'ELF: instructions num: (\d+)'

# VM Circuit Phase (Core)
raw_proof_time = 'Prove cost: ([\d.]+) s'
raw_proof_size_bytes = 'proof size: (\d+) Bytes'

# ----------------------------------------------------------------
# 指标映射 (Metric Mapping)
# ----------------------------------------------------------------
[metric_mapping]
"instruction_count" = "raw_instruction_count"
"vm_prove_time_s" = "raw_proof_time"
"vm_prove_proof_size_bytes" = "raw_proof_size_bytes"
