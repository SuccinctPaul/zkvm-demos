# GitHub Actions Workflow for zkVM Benchmarks
# Place this in: .github/workflows/benchmark.yml

name: zkVM Benchmark CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run benchmarks daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      zkvms:
        description: 'zkVMs to test (comma-separated: sp1,risc0,nexus)'
        required: false
        default: 'sp1'
      scales:
        description: 'Test scales (comma-separated: 10,100,1000)'
        required: false
        default: '10,100'

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    name: Run Benchmarks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    
    strategy:
      matrix:
        os: [ubuntu-latest]
        # Future: Add macOS and Windows
        # os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # For git history
      
      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache Cargo Registry
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang lld pkg-config libssl-dev
      
      - name: Build Benchmark Tools
        working-directory: zkvm_benchmark_utils
        run: |
          cargo build --release --verbose
          echo "Build completed successfully"
      
      - name: Collect Hardware Info
        run: |
          echo "### System Information ###"
          uname -a
          echo "### CPU Info ###"
          lscpu || sysctl -n machdep.cpu.brand_string
          echo "### Memory Info ###"
          free -h || vm_stat
          echo "### Disk Info ###"
          df -h
      
      - name: Run Benchmarks (Non-Interactive)
        working-directory: zkvm_benchmark_utils
        run: |
          ./target/release/zkvm-benchmark run \
            --non-interactive \
            --zkvms ${{ github.event.inputs.zkvms || 'sp1' }} \
            --scales ${{ github.event.inputs.scales || '10' }} \
            --runs 3 \
            --warmup 1 \
            --output-format json
        env:
          RUST_LOG: info
      
      - name: Upload Raw Logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-logs-${{ matrix.os }}-${{ github.run_number }}
          path: zkvm_benchmark_utils/benchmark-results/raw-logs/
          retention-days: 30
      
      - name: Upload Parsed Metrics
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-metrics-${{ matrix.os }}-${{ github.run_number }}
          path: zkvm_benchmark_utils/benchmark-results/parsed-metrics/
          retention-days: 90
      
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: benchmark-reports-${{ matrix.os }}-${{ github.run_number }}
          path: zkvm_benchmark_utils/benchmark-results/reports/
          retention-days: 90
      
      - name: Check for Performance Regression
        working-directory: zkvm_benchmark_utils
        run: |
          if [ -f benchmark-baseline.json ]; then
            ./target/release/zkvm-benchmark check-regression \
              --baseline benchmark-baseline.json \
              --current benchmark-results/reports/summary.json \
              --threshold 10 \
              --fail-on-regression
          else
            echo "No baseline found, skipping regression check"
          fi
      
      - name: Comment PR with Results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'zkvm_benchmark_utils/benchmark-results/reports/report.md';
            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Benchmark Results\n\n${report}`
              });
            }
      
      - name: Save Baseline (main branch only)
        if: github.ref == 'refs/heads/main' && success()
        working-directory: zkvm_benchmark_utils
        run: |
          cp benchmark-results/reports/summary.json benchmark-baseline.json
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add benchmark-baseline.json
          git commit -m "Update benchmark baseline [skip ci]" || echo "No changes"
          # Uncomment to auto-push (be careful!)
          # git push

