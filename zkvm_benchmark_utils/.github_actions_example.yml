# Optional: Separate job for different zkVMs
  benchmark-sp1:
    name: SP1 Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run SP1
        working-directory: zkvm_benchmark_utils
