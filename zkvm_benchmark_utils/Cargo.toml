[package]
name = "zkvm_benchmark_utils"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zkvm-benchmark"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# Logging and CLI
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

# Regex and Text Processing
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

# Files and IO
walkdir = "2.5"
csv = "1.3"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# Process Management
tokio = { version = "1.40", features = ["full"] }

# Table Output
comfy-table = "7.1"

# System Info Collection
sysinfo = "0.30"

# Singleton
once_cell = "1.19"

# Performance Optimization
parking_lot = "0.12"
num_cpus = "1.16"
futures = "0.3"

# Progress Tracking
indicatif = "0.17"
rayon = "1.11.0"

[dev-dependencies]
tempfile = "3.13"
criterion = "0.5"
atty = "0.2"
