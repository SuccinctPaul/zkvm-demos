[package]
name = "zkvm_benchmark_utils"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "zkvm-benchmark"
path = "src/main.rs"

[dependencies]
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
toml = "0.8"

# 日志和CLI
clap = { version = "4.5", features = ["derive"] }
env_logger = "0.11"
log = "0.4"

# 正则表达式和文本处理
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }

# 文件和IO
walkdir = "2.5"
csv = "1.3"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 进程管理
tokio = { version = "1.40", features = ["full"] }

# 表格输出
comfy-table = "7.1"

# 系统信息收集
sysinfo = "0.30"

# 单例
once_cell = "1.19"

# 性能优化
parking_lot = "0.12"
num_cpus = "1.16"
futures = "0.3"

# 进度追踪
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.13"
criterion = "0.5"
atty = "0.2"
