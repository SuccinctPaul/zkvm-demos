# ZisK zkVM specific toolchain configuration

[tools]
# ZisK requires stable Rust
rust = "1.86"

[env]
# ZisK-specific environment variables
RUST_LOG = "info"

[tasks.install-zisk]
description = "Install ZisK toolchain"
run = "../scripts/sdk_installers/install_zisk_sdk.sh"

[tasks.run]
description = "Run ZisK demo"
run = "cd zisk-host && RUST_LOG=info cargo run --release"

[tasks.build-guest]
description = "Build ZisK guest program"
run = "cd zisk-guest && cargo build --release"

[tasks.run-gpu]
description = "Run ZisK demo with GPU acceleration"
run = "cd zisk-host && cargo-zisk-gpu run --release"

