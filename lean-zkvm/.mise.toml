# Lean zkVM specific toolchain configuration

[tools]
# Lean requires stable Rust 1.85+
rust = "1.85"

[env]
# Lean-specific environment
RUST_LOG = "info"
FIBONACCI_N = "10"

[tasks.install-lean]
description = "Install Lean toolchain dependencies"
run = "../scripts/sdk_installers/install_lean_sdk.sh"

[tasks.run]
description = "Run Lean demo"
run = "./run_demo.sh"

[tasks.run-custom]
description = "Run with custom Fibonacci input"
run = "./run_demo.sh 20"

[tasks.run-native]
description = "Run with native CPU optimizations"
run = "RUSTFLAGS='-C target-cpu=native' ./run_demo.sh"

[tasks.build]
description = "Build Lean project"
run = "cargo build --release"

[tasks.test]
description = "Run tests"
run = "cargo test"

