[package]
name = "methods"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
# RISC0 guest library with crypto accelerators
risc0-zkvm = { version = "3.0.3", default-features = false, features = ["std"] }
# Use no_std for guest (zkVM environment)
zkvm_programs = { path = "../../../programs", default-features = false }

# RISC0 automatically patches these crates to use accelerators
# The risc0-zkvm crate provides syscalls for accelerated:
# - SHA256 (sha2 crate)
# - Keccak256
# - secp256k1 ECDSA (k256 crate)
