# Risc0 zkVM specific toolchain configuration

[tools]
# Risc0 requires nightly Rust
rust = "nightly-2025-06-05"

[env]
# Risc0-specific environment variables
RISC0_DEV_MODE = "1"
RUST_LOG = "info"
RISC0_INFO = "1"

[tasks.install-risc0]
description = "Install Risc0 toolchain"
run = '''
echo "Installing Risc0 zkVM toolchain..."
curl -L https://risczero.com/install | bash
rizup install
cargo install cargo-risczero
cargo risczero install
echo "✓ Risc0 toolchain installed"
'''

[tasks.run-dev]
description = "Run Risc0 demo in dev mode (fast)"
run = "cd risc0-host && RISC0_DEV_MODE=1 RUST_LOG=info RISC0_INFO=1 cargo run --release"

[tasks.run-prod]
description = "Run Risc0 demo in production mode (with proofs)"
run = "cd risc0-host && RISC0_DEV_MODE=0 RUST_LOG=debug RISC0_INFO=1 cargo run --release"

[tasks.build-guest]
description = "Build Risc0 guest program"
run = "cd risc0-guest && cargo build --release"

