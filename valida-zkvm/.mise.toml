# Valida zkVM specific toolchain configuration

[tools]
# Valida requires Rust and LLVM 18+
rust = "1.86"
# Note: LLVM must be installed separately (mise doesn't manage LLVM well)

[env]
# Valida-specific environment
LLVM_SYS_180_PREFIX = "/opt/homebrew/opt/llvm@18"  # macOS
# For Linux, this might be /usr/lib/llvm-18

_.path = ["$HOME/.local/bin", "$HOME/.cargo/bin"]

[tasks.check-llvm]
description = "Check LLVM installation"
run = '''
echo "Checking LLVM installation..."
if command -v llvm-config &> /dev/null; then
    echo "✓ LLVM version: $(llvm-config --version)"
else
    echo "❌ LLVM not found. Please install LLVM 18.1.7+"
    echo "  macOS: brew install llvm@18"
    echo "  Ubuntu: wget https://apt.llvm.org/llvm.sh && sudo bash llvm.sh 18"
fi
'''

[tasks.install-valida]
description = "Install Valida toolchain"
run = "../scripts/sdk_installers/install_valida_sdk.sh"

[tasks.compile-c]
description = "Compile C program to Valida ELF"
run = "valida-cc -o fib.elf valida-guest/fib.c"

[tasks.run]
description = "Run Valida program"
run = "valida run fib.elf"

[tasks.prove]
description = "Generate Valida proof"
run = "valida prove fib.elf -o proof.bin"

[tasks.verify]
description = "Verify Valida proof"
run = "valida verify proof.bin"

