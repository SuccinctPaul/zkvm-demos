[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    "snarkvm-host",
]
resolver = "2"

[workspace.dependencies]
zkvm_programs = { path = "../../programs" }

# snarkVM is used via Leo CLI for Aleo programs
# Install Leo: https://developer.aleo.org/leo/installation

# misc
anyhow = "1.0"
colored = "2.1"
rand = "0.8"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }

[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
