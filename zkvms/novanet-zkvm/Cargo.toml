[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace]
members = [
    "novanet-guest",
    "novanet-host",
]
resolver = "2"

[workspace.dependencies]
zkvm_programs = { path = "../../programs" }

# NovaNet zkEngine SDK
zk-engine = { git = "https://github.com/ICME-Lab/zkEngine_dev", branch = "main" }

# misc
dotenv = "0.15.0"
anyhow = "1.0.98"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
rand = "0.8"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"

# Always optimize; building and running the guest takes much longer without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true

