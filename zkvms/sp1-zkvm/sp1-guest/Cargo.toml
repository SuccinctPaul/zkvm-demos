[package]
version = "0.1.0"
name = "sp1-guest"
edition = "2021"

[dependencies]
sp1-zkvm = "5.2.2"
# Use no_std for guest (zkVM environment)
zkvm_programs = { path = "../../../programs", default-features = false }

# SP1 automatically patches these crates to use precompiles
# sha2 -> sp1-zkvm syscall (accelerated SHA256)
# k256 -> sp1-zkvm syscall (accelerated secp256k1)
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", branch = "patch-sha2-v0.10.8" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", package = "k256", branch = "n/k256-13.4" }
