[package]
name = "airbender-guest"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "airbender-guest"
path = "src/main.rs"

[dependencies]
# ZKsync Airbender RISC-V runtime
# https://github.com/matter-labs/zksync-airbender
airbender_riscv_common.workspace = true

# Common library for benchmarks (no_std)
# Uses execute_program(program_id, n) for multi-program support
zkvm_programs = { path = "../../../programs", default-features = false }

[features]
default = []

[lints]
workspace = true
