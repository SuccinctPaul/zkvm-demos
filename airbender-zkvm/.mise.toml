# Airbender zkVM specific toolchain configuration

[tools]
# Airbender uses stable Rust
rust = "1.86"

[env]
# Airbender-specific environment
RUST_LOG = "info"
FIB_N = "10"

[tasks.install-airbender]
description = "Install Airbender toolchain (when available)"
run = '''
echo "⚠️  Airbender is zkSync's high-performance RISC-V zkVM"
echo "The official SDK will be available once publicly released"
echo "Check https://docs.zksync.io/zk-stack/components/zksync-airbender for updates"
'''

[tasks.run]
description = "Run Airbender demo"
run = "./run_demo.sh"

[tasks.run-custom]
description = "Run with custom Fibonacci input"
run = "FIB_N=15 ./run_demo.sh"

[tasks.build]
description = "Build Airbender project"
run = "cargo build --release"

