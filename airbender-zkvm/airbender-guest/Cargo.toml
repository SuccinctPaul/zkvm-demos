[package]
name = "airbender-guest"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "airbender-guest"
path = "src/main.rs"

[dependencies]
# ZKsync Airbender RISC-V runtime
# https://github.com/matter-labs/zksync-airbender
airbender_riscv_common.workspace = true

# Local program logic (no_std compatible)
# Note: Guest programs don't use zkvm_programs directly
# They implement the computation inline for RISC-V

[features]
default = []

[lints]
workspace = true
