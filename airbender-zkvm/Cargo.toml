[workspace]
members = [
    "airbender-guest",
    "airbender-host",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
zkvm_programs = { path = "../programs" }

# ZKsync Airbender SDK dependencies
# Reference: https://github.com/matter-labs/zksync-airbender
# Reference: https://github.com/eth-act/ere/blob/master/Cargo.toml
airbender_execution_utils = { git = "https://github.com/matter-labs/zksync-airbender.git", package = "execution_utils", tag = "v0.5.0" }
airbender_riscv_common = { git = "https://github.com/matter-labs/zksync-airbender.git", package = "riscv_common", tag = "v0.5.0" }

# Common dependencies
anyhow = "1.0"
bincode = { version = "2.0", features = ["alloc", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.0"
thiserror = "1.0"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 3

[workspace.lints]
