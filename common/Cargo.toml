[package]
name = "common"
version = "0.2.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"

[dependencies]
dotenv = { version = "0.15.0", optional = true }
anyhow = { version = "*", optional = true }

# Optional crypto dependencies for hash and signature programs
sha2 = { version = "0.10", default-features = false, optional = true }

[features]
default = ["std", "crypto"]
std = ["dotenv", "anyhow"]
crypto = ["sha2"]
# For no_std environments (guest programs)
guest = []

