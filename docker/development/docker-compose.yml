# Development Mode Docker Compose
# Simplified: Single service per ZKVM, supports both run and shell modes

services:
  # Nexus ZKVM - Development
  nexus-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.nexus.toolchain
    image: nexus-zkvm-toolchain:latest
    container_name: nexus-dev
    volumes:
      - ../../:/workspace
      - nexus-cargo-cache:/usr/local/cargo/registry
      - nexus-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
      - ZKVM_ARGS=${ZKVM_ARGS:---nocapture}
    stdin_open: true
    tty: true
    profiles:
      - nexus
      - all

  # Risc0 ZKVM - Development
  risc0-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.risc0.toolchain
    image: risc0-zkvm-toolchain:latest
    container_name: risc0-dev
    volumes:
      - ../../:/workspace
      - risc0-cargo-cache:/usr/local/cargo/registry
      - risc0-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RISC0_DEV_MODE=1
      - RUST_LOG=info
      - RISC0_INFO=1
      - ZKVM_ARGS=${ZKVM_ARGS}
    stdin_open: true
    tty: true
    profiles:
      - risc0
      - all

  # SP1 ZKVM - Development
  sp1-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.sp1.toolchain
    image: sp1-zkvm-toolchain:latest
    container_name: sp1-dev
    volumes:
      - ../../:/workspace
      - sp1-cargo-cache:/usr/local/cargo/registry
      - sp1-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
      - ZKVM_ARGS=${ZKVM_ARGS:---execute}
    stdin_open: true
    tty: true
    profiles:
      - sp1
      - all

  # ZKM ZKVM - Development
  zkm-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.zkm.toolchain
    image: zkm-zkvm-toolchain:latest
    container_name: zkm-dev
    volumes:
      - ../../:/workspace
      - zkm-cargo-cache:/usr/local/cargo/registry
      - zkm-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
      - ZKVM_ARGS=${ZKVM_ARGS}
    stdin_open: true
    tty: true
    profiles:
      - zkm
      - all

# Persistent volumes for build caching
volumes:
  nexus-cargo-cache:
    driver: local
  nexus-target-cache:
    driver: local
  risc0-cargo-cache:
    driver: local
  risc0-target-cache:
    driver: local
  sp1-cargo-cache:
    driver: local
  sp1-target-cache:
    driver: local
  zkm-cargo-cache:
    driver: local
  zkm-target-cache:
    driver: local

