version: '3.8'

# Development Mode Docker Compose
# Toolchain images with source code mounting and build caching

services:
  # Nexus ZKVM - Development (Toolchain)
  nexus-zkvm-toolchain:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.nexus.toolchain
    image: nexus-zkvm-toolchain:latest
    container_name: nexus-zkvm-dev
    volumes:
      - ../../:/workspace
      - nexus-cargo-cache:/usr/local/cargo/registry
      - nexus-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
      - ZKVM_ARGS=${ZKVM_ARGS:---nocapture}
    command: ["bash", "-c", "cd nexus-zkvm/nexus-host && cargo run -r -- ${ZKVM_ARGS}"]
    profiles:
      - nexus
      - all

  # Risc0 ZKVM - Development (Toolchain)
  risc0-zkvm-toolchain:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.risc0.toolchain
    image: risc0-zkvm-toolchain:latest
    container_name: risc0-zkvm-dev
    volumes:
      - ../../:/workspace
      - risc0-cargo-cache:/usr/local/cargo/registry
      - risc0-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RISC0_DEV_MODE=1
      - RUST_LOG=info
      - RISC0_INFO=1
      - ZKVM_ARGS=${ZKVM_ARGS}
    command: ["bash", "-c", "cd risc0-zkvm/risc0-host && RISC0_DEV_MODE=1 RUST_LOG=info RISC0_INFO=1 cargo run --release ${ZKVM_ARGS}"]
    profiles:
      - risc0
      - all

  # SP1 ZKVM - Development (Toolchain)
  sp1-zkvm-toolchain:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.sp1.toolchain
    image: sp1-zkvm-toolchain:latest
    container_name: sp1-zkvm-dev
    volumes:
      - ../../:/workspace
      - sp1-cargo-cache:/usr/local/cargo/registry
      - sp1-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
      - ZKVM_ARGS=${ZKVM_ARGS:---execute}
    command: ["bash", "-c", "cd sp1-zkvm/sp1-host && RUST_LOG=info cargo run --release -- ${ZKVM_ARGS}"]
    profiles:
      - sp1
      - all

  # ZKM ZKVM - Development (Toolchain)
  zkm-zkvm-toolchain:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.zkm.toolchain
    image: zkm-zkvm-toolchain:latest
    container_name: zkm-zkvm-dev
    volumes:
      - ../../:/workspace
      - zkm-cargo-cache:/usr/local/cargo/registry
      - zkm-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
      - ZKVM_ARGS=${ZKVM_ARGS}
    command: ["bash", "-c", "cd zkm-zkvm/zkm-host && RUST_LOG=info cargo run --release ${ZKVM_ARGS}"]
    profiles:
      - zkm-toolchain
      - all

  # Interactive shell for development debugging
  nexus-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.nexus.toolchain
    image: nexus-zkvm-toolchain:latest
    container_name: nexus-dev
    volumes:
      - ../../:/workspace
      - nexus-cargo-cache:/usr/local/cargo/registry
      - nexus-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: ["bash"]
    stdin_open: true
    tty: true
    profiles:
      - dev

  risc0-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.risc0.toolchain
    image: risc0-zkvm-toolchain:latest
    container_name: risc0-dev
    volumes:
      - ../../:/workspace
      - risc0-cargo-cache:/usr/local/cargo/registry
      - risc0-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RISC0_DEV_MODE=1
      - RUST_LOG=info
      - RISC0_INFO=1
    command: ["bash"]
    stdin_open: true
    tty: true
    profiles:
      - dev

  sp1-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.sp1.toolchain
    image: sp1-zkvm-toolchain:latest
    container_name: sp1-dev
    volumes:
      - ../../:/workspace
      - sp1-cargo-cache:/usr/local/cargo/registry
      - sp1-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: ["bash"]
    stdin_open: true
    tty: true
    profiles:
      - dev

  zkm-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.zkm.toolchain
    image: zkm-zkvm-toolchain:latest
    container_name: zkm-dev
    volumes:
      - ../../:/workspace
      - zkm-cargo-cache:/usr/local/cargo/registry
      - zkm-target-cache:/workspace/target
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: ["bash"]
    stdin_open: true
    tty: true
    profiles:
      - dev

# Persistent volumes for build caching
volumes:
  nexus-cargo-cache:
    driver: local
  nexus-target-cache:
    driver: local
  risc0-cargo-cache:
    driver: local
  risc0-target-cache:
    driver: local
  sp1-cargo-cache:
    driver: local
  sp1-target-cache:
    driver: local
  zkm-cargo-cache:
    driver: local
  zkm-target-cache:
    driver: local

