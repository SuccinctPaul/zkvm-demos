version: '3.8'

# Production Mode Docker Compose
# Precompiled images for fast deployment

services:
  # Nexus ZKVM - Production
  nexus-zkvm:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.nexus
    image: nexus-zkvm:latest
    container_name: nexus-zkvm-prod
    volumes:
      - ../../:/workspace
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: ["bash", "-c", "cd nexus-zkvm/nexus-host && cargo run -r -- --nocapture"]
    profiles:
      - nexus
      - all

  # Risc0 ZKVM - Production
  risc0-zkvm:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.risc0
    image: risc0-zkvm:latest
    container_name: risc0-zkvm-prod
    volumes:
      - ../../:/workspace
    working_dir: /workspace
    environment:
      - RISC0_DEV_MODE=1
      - RUST_LOG=info
      - RISC0_INFO=1
    command: ["bash", "-c", "cd risc0-zkvm/risc0-host && RISC0_DEV_MODE=1 RUST_LOG=info RISC0_INFO=1 cargo run --release"]
    profiles:
      - risc0
      - all

  # SP1 ZKVM - Production
  sp1-zkvm:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.sp1
    image: sp1-zkvm:latest
    container_name: sp1-zkvm-prod
    volumes:
      - ../../:/workspace
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: ["bash", "-c", "cd sp1-zkvm/sp1-host && RUST_LOG=info cargo run --release -- --execute"]
    profiles:
      - sp1
      - all

  # ZKM ZKVM - Production
  zkm-zkvm:
    build:
      context: ../..
      dockerfile: docker/production/Dockerfile.zkm
    image: zkm-zkvm:latest
    container_name: zkm-zkvm-prod
    volumes:
      - ../../:/workspace
    working_dir: /workspace
    environment:
      - RUST_LOG=info
    command: ["bash", "-c", "cd zkm-zkvm/zkm-host && RUST_LOG=info cargo run --release"]
    profiles:
      - zkm
      - all

