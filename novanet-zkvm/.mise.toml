# Novanet zkVM specific toolchain configuration

[tools]
# Novanet uses stable Rust 1.85+
rust = "1.85"

[env]
# Novanet-specific environment
RUST_LOG = "info"
FIBONACCI_N = "10"

[tasks.install-novanet]
description = "Install Novanet dependencies"
run = "../scripts/sdk_installers/install_novanet_sdk.sh"

[tasks.run]
description = "Run Novanet demo"
run = "./run_demo.sh"

[tasks.run-custom]
description = "Run with custom Fibonacci input"
run = "FIBONACCI_N=15 ./run_demo.sh"

[tasks.build]
description = "Build Novanet project"
run = "cargo build --release"

[tasks.test]
description = "Run tests"
run = "cargo test"

[tasks.verify]
description = "Run verification script"
run = "./verify.sh"

