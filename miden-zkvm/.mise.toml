# Miden zkVM specific toolchain configuration

[tools]
# Miden uses stable Rust
rust = "1.86"

[env]
# Miden-specific environment variables
RUST_LOG = "info"

[tasks.install-miden]
description = "Install Miden toolchain"
run = "../scripts/sdk_installers/install_miden_sdk.sh"

[tasks.run]
description = "Run Miden demo"
run = "cd miden-host && RUST_LOG=info cargo run --release"

[tasks.prove-fib]
description = "Prove Fibonacci program"
run = "miden prove --assembly programs/fibonacci.masm --operand-stack 10"

[tasks.run-fib]
description = "Run Fibonacci program"
run = "miden run --assembly programs/fibonacci.masm --operand-stack 10"

[tasks.verify]
description = "Verify proof"
run = "miden verify --proof proof.bin"

