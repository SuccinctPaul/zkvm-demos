[package]
name = "ceno-guest"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ceno-guest"
path = "src/main.rs"

[dependencies]
# Using Nexus zkVM as a proof-of-concept implementation
# until CENO SDK is officially released
nexus-rt = { git = "https://github.com/nexus-xyz/nexus-zkvm.git", tag = "0.3.4", version = "0.3.4" }

# Fibonacci computation library
fib = { path = "../../fib" }

[features]
cycles = [] # Enable cycle counting for run command

