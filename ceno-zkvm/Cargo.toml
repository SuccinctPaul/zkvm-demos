[workspace]
members = [
    "ceno-guest",
    "ceno-host",
]
resolver = "2"

[workspace.dependencies]
zkvm_programs = { path = "../programs" }

# CENO SDK from Scroll (official implementation)
# https://github.com/scroll-tech/ceno
ceno_rt = { git = "https://github.com/scroll-tech/ceno.git", branch = "master" }
ceno_host = { git = "https://github.com/scroll-tech/ceno.git", branch = "master" }
ceno_emul = { git = "https://github.com/scroll-tech/ceno.git", branch = "master" }
# ceno_zkvm for proving (requires significant compilation time)
# Uncomment when full proving is needed:
# ceno_zkvm = { git = "https://github.com/scroll-tech/ceno.git", branch = "master" }

[profile.release]
opt-level = 3
lto = true

[profile.dev]
opt-level = 0
