[package]
name = "ceno-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ceno-host"
path = "src/main.rs"

[dependencies]
# Using Nexus zkVM as a proof-of-concept implementation
# until CENO SDK is officially released
nexus-sdk = { git = "https://github.com/nexus-xyz/nexus-zkvm.git", tag = "0.3.4", version = "0.3.4" }
nexus-profiler = { git = "https://github.com/nexus-xyz/nexus-zkvm.git", tag = "0.3.4", version = "0.3.4" }

# Common utilities
common = { path = "../../common" }
fib = { path = "../../fib" }

# Environment and logging
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"

