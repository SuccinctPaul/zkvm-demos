# ZKM zkVM specific toolchain configuration

[tools]
# ZKM requires nightly Rust
rust = "nightly-2025-06-05"

[env]
# ZKM-specific environment variables
RUST_LOG = "info"

[tasks.install-zkm]
description = "Install ZKM toolchain"
run = '''
echo "Installing ZKM zkVM toolchain..."
cargo install --git https://github.com/ProjectZKM/zkm-project-template cargo-zkm
echo "✓ ZKM toolchain installed"
'''

[tasks.run-execute]
description = "Run ZKM demo (execute only)"
run = "cd zkm-host && RUST_LOG=info cargo run --release -- --execute"

[tasks.run-core]
description = "Run ZKM demo (core proof)"
run = "cd zkm-host && RUST_LOG=debug cargo run --release -- --core"

[tasks.run-compressed]
description = "Run ZKM demo (compressed proof)"
run = "cd zkm-host && RUST_LOG=debug cargo run --release -- --compressed"

[tasks.run-evm-groth16]
description = "Run ZKM demo (Groth16 EVM proof)"
run = "cd zkm-host && cargo run --release --bin evm -- --system groth16"

[tasks.run-evm-plonk]
description = "Run ZKM demo (PLONK EVM proof)"
run = "cd zkm-host && cargo run --release --bin evm -- --system plonk"

