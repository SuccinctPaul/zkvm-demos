# zkvm-demos mise configuration
# This file manages toolchain versions for the entire project
# Each zkVM subdirectory may have its own .mise.toml for specific requirements

[tools]
# Default Rust toolchain (matches root rust-toolchain.toml)
# Individual zkVM directories will override this with their own settings
rust = "nightly-2025-06-05"

# Python for Cairo and other Python-based tools
python = "3.11"

# Node.js for some zkVM tooling and scripts
node = "20"

[env]
# Common environment variables
_.path = ["$PWD/scripts/sdk_installers", "$HOME/.local/bin", "$HOME/.cargo/bin"]

# Rust-specific settings
RUSTFLAGS = "-C target-cpu=native"

[settings]
# Enable experimental features
experimental = true

# Automatically install missing tools
auto_install = true

# Use symlinks for faster switching
use_symlinks = true

[tasks.check-tools]
description = "Check which zkVM tools are installed"
run = '''
echo "=== Installed zkVM Toolchains ==="
echo ""
echo "Rust: $(rustc --version 2>/dev/null || echo 'not installed')"
echo "Cargo: $(cargo --version 2>/dev/null || echo 'not installed')"
echo ""
echo "Python: $(python --version 2>/dev/null || echo 'not installed')"
echo "Scarb (Cairo): $(scarb --version 2>/dev/null || echo 'not installed')"
echo ""
echo "Node.js: $(node --version 2>/dev/null || echo 'not installed')"
echo ""
echo "=== zkVM-specific Tools ==="
echo "cargo-risczero: $(cargo risczero --version 2>/dev/null || echo 'not installed')"
echo "cargo-prove (SP1): $(cargo prove --version 2>/dev/null || echo 'not installed')"
echo "jolt: $(jolt --version 2>/dev/null || echo 'not installed')"
echo "valida-cc: $(valida-cc --version 2>/dev/null || echo 'not installed')"
echo "cairo-m-compiler: $(cairo-m-compiler --version 2>/dev/null || echo 'not installed')"
echo ""
'''

[tasks.install-rust-tools]
description = "Install common Rust zkVM tools"
run = '''
echo "Installing Rust-based zkVM tools..."
rustup target add riscv32imac-unknown-none-elf riscv64imac-unknown-none-elf wasm32-unknown-unknown
echo "✓ Rust targets installed"
'''

[tasks.setup-cairo]
description = "Install Cairo toolchain (Scarb)"
run = "./scripts/sdk_installers/install_cairo_sdk.sh"

[tasks.setup-jolt]
description = "Install Jolt toolchain"
run = "./scripts/sdk_installers/install_jolt_sdk.sh"

[tasks.setup-valida]
description = "Install Valida toolchain"
run = "./scripts/sdk_installers/install_valida_sdk.sh"

[tasks.list-zkvms]
description = "List all zkVM projects in this repository"
run = '''
echo "=== Available zkVM Projects ==="
ls -d */ | grep -E "zkvm|cairo" | grep -v target | grep -v scripts | sort
'''

