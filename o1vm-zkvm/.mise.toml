# o1vm zkVM specific toolchain configuration

[tools]
# o1vm uses stable Rust
rust = "1.86"

[env]
# o1vm-specific environment
RUST_LOG = "info"

[tasks.install-o1vm]
description = "Install o1vm dependencies"
run = "../scripts/sdk_installers/install_o1vm_sdk.sh"

[tasks.run]
description = "Run o1vm demo"
run = "./run_demo.sh"

[tasks.build]
description = "Build o1vm project"
run = "cd o1vm-host && cargo build --release"

[tasks.compile-guest]
description = "Compile guest C program"
run = '''
echo "Compiling o1vm guest program..."
echo "Requires RISC-V GCC toolchain"
echo "See PROJECT_OVERVIEW.md for details"
'''

