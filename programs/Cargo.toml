[package]
name = "zkvm_programs"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Benchmark programs for zkvms"

[dependencies]
# Crypto: sha2 supports no_std
sha2 = { version = "0.10", default-features = false }

# Optional: for loading config from env (host only)
dotenv = { version = "0.15", optional = true }

[features]
default = ["std"]
std = ["dotenv"]
