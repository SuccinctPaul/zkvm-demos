[package]
name = "zkvm_programs"
version = "0.3.0"
edition = "2021"
rust-version = "1.81"
license = "MIT OR Apache-2.0"
description = "Benchmark programs for zkvms"

[dependencies]
# SHA256 hash (no_std compatible)
# When used with zkVM toolchains, this is automatically patched to use precompiles:
# - SP1: sp1-patches/RustCrypto-hashes (patch-sha2-v0.10.8)
# - RISC0: accelerated via risc0-zkvm syscalls
sha2 = { version = "0.10", default-features = false }

# ECDSA secp256k1 (no_std compatible)
# When used with zkVM toolchains, this is automatically patched to use precompiles:
# - SP1: sp1-patches/elliptic-curves (n/k256-13.4)
# - RISC0: accelerated via risc0-zkvm syscalls
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "alloc"] }

# Optional: for loading config from env (host only)
dotenv = { version = "0.15", optional = true }

[features]
default = ["std"]
# Enable std features for host programs (env loading, logging)
std = ["dotenv"]

# For zkVM guests, use: default-features = false
# Example:
#   [dependencies]
#   zkvm_programs = { path = "...", default-features = false }
