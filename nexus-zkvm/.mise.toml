# Nexus zkVM specific toolchain configuration

[tools]
# Nexus requires nightly Rust
rust = "nightly-2025-06-05"

[env]
# Nexus-specific environment variables
RUST_LOG = "info"

[tasks.install-nexus]
description = "Install Nexus toolchain"
run = '''
echo "Installing Nexus zkVM toolchain..."
cargo install --git https://github.com/nexus-xyz/nexus-zkvm cargo-nexus --tag 'v0.2.0'
echo "✓ Nexus toolchain installed"
'''

[tasks.run]
description = "Run Nexus demo"
run = "cd nexus-host && RUST_LOG=info cargo run -r -- --nocapture"

[tasks.build-guest]
description = "Build Nexus guest program"
run = "cd nexus-guest && cargo build --release"

