# Jolt zkVM specific toolchain configuration

[tools]
# Jolt requires stable Rust 1.88 with RISC-V targets
rust = "1.88"

[env]
# Jolt-specific environment variables
FIBONACCI_N = "10"
RUST_LOG = "info"

# Add jolt to PATH
_.path = ["$HOME/.cargo/bin"]

[tasks.install-jolt]
description = "Install Jolt toolchain and RISC-V targets"
run = '''
echo "Installing Jolt zkVM toolchain..."
rustup target add riscv32imac-unknown-none-elf riscv64imac-unknown-none-elf
cargo +nightly install --git https://github.com/a16z/jolt --force --bins jolt
jolt install-toolchain
echo "✓ Jolt toolchain installed"
'''

[tasks.run]
description = "Run Jolt demo"
run = "cd jolt-host && RUST_LOG=info cargo run --release"

[tasks.build-guest]
description = "Build Jolt guest program"
run = "cd jolt-guest && cargo build --release"

